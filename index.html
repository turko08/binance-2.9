<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LinkServi Pro - Binance Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        binanceDark: '#181A20',
                        binanceCard: '#1E2329',
                        binanceYellow: '#FCD535',
                        binanceGreen: '#0ECB81',
                        binanceRed: '#F6465D',
                        binanceBorder: '#2B313A',
                        binanceTextGray: '#848E9C'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #181A20; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto relative overflow-hidden">
    <header class="flex items-center justify-between px-4 py-3 bg-binanceDark border-b border-binanceBorder">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-binanceYellow flex items-center justify-center text-binanceDark font-black text-lg">LS</div>
            <div>
                <h1 class="text-sm font-bold leading-tight">LinkServi Pro</h1>
                <p class="text-[10px] text-binanceTextGray"><span class="w-1.5 h-1.5 rounded-full bg-binanceGreen inline-block mr-1"></span> VIP 1 • Verificado</p>
            </div>
        </div>
    </header>
    <main class="flex-1 overflow-y-auto hide-scrollbar pb-20 p-4">
        <div class="text-xs text-binanceTextGray mb-1">Saldo Estimado Total</div>
        <div class="flex items-baseline space-x-2">
            <h2 class="text-2xl font-black tracking-tight">$12,450.80</h2>
            <span class="text-xs text-binanceTextGray">USDT</span>
        </div>
        <div class="grid grid-cols-4 gap-2 mt-5">
            <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-binanceCard">
                <div class="w-10 h-10 rounded-full bg-binanceYellow/10 text-binanceYellow flex items-center justify-center mb-1"><i class="fa-solid fa-arrow-down text-sm"></i></div>
                <span class="text-[11px] font-medium text-white">Depositar</span>
            </div>
            <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-binanceCard">
                <div class="w-10 h-10 rounded-full bg-binanceYellow/10 text-binanceYellow flex items-center justify-center mb-1"><i class="fa-solid fa-arrow-up text-sm"></i></div>
                <span class="text-[11px] font-medium text-white">Retirar</span>
            </div>
            <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-binanceCard">
                <div class="w-10 h-10 rounded-full bg-binanceYellow/10 text-binanceYellow flex items-center justify-center mb-1"><i class="fa-solid fa-repeat text-sm"></i></div>
                <span class="text-[11px] font-medium text-white">P2P C2P</span>
            </div>
            <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-binanceCard">
                <div class="w-10 h-10 rounded-full bg-binanceYellow/10 text-binanceYellow flex items-center justify-center mb-1"><i class="fa-solid fa-ellipsis text-sm"></i></div>
                <span class="text-[11px] font-medium text-white">Más</span>
            </div>
        </div>
        <div class="mt-6 space-y-3">
            <div class="flex items-center justify-between py-2">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs">₿</div>
                    <div><span class="font-bold text-sm">BTC</span><p class="text-[11px] text-binanceTextGray">/USDT</p></div>
                </div>
                <div class="text-right"><div class="font-bold text-sm">91,420.50</div><div class="text-[11px] text-binanceGreen">+3.45%</div></div>
            </div>
            <div class="flex items-center justify-between py-2">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-xs">Ξ</div>
                    <div><span class="font-bold text-sm">ETH</span><p class="text-[11px] text-binanceTextGray">/USDT</p></div>
                </div>
                <div class="text-right"><div class="font-bold text-sm">3,410.20</div><div class="text-[11px] text-binanceGreen">+1.82%</div></div>
            </div>
        </div>
    </main>
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-binanceDark border-t border-binanceBorder flex justify-around items-center px-2">
        <div class="flex flex-col items-center text-binanceYellow"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] mt-1">Inicio</span></div>
        <div class="flex flex-col items-center text-binanceTextGray"><i class="fa-solid fa-chart-line text-lg"></i><span class="text-[10px] mt-1">Mercados</span></div>
        <div class="flex flex-col items-center text-binanceTextGray"><div class="w-10 h-10 rounded-full bg-binanceYellow text-binanceDark flex items-center justify-center -mt-3"><i class="fa-solid fa-right-left text-sm"></i></div><span class="text-[10px]">Trade</span></div>
        <div class="flex flex-col items-center text-binanceTextGray"><i class="fa-solid fa-bolt text-lg"></i><span class="text-[10px] mt-1">Futuros</span></div>
        <div class="flex flex-col items-center text-binanceTextGray"><i class="fa-solid fa-wallet text-lg"></i><span class="text-[10px] mt-1">Billetera</span></div>
    </nav>
</body>
</html>
